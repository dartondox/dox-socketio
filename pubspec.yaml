name: dox_socketio
description: Socket.IO v4 server (Engine.IO v4, Socket.IO protocol v5) for the Dox framework and plain dart:io.
version: 3.1.1
repository: https://github.com/dartondox/dox-socketio
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.8
  # Raise to the dox_annotation release that has install.dart before
  # releasing this package.
  dox_annotation: ^3.1.0
  # raise dox_core to the release that has Dox().isWebServer
  dox_core: ^3.1.3
  dox_http_native: ^3.0.0
  ioredis: ^3.0.2

dev_dependencies:
  http: ^1.6.0
  lints: ^6.1.0
  test: ^1.33.0
  socket_io_client: ^3.1.6

# The `dox` CLI finds the commands of this package here
# (`dox socketio:install`).
dox:
  commands: package:dox_socketio/commands.dart
