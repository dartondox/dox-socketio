name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs these tests on the tag first.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      # the interop tests run the real socket.io-client in node
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The other Dox packages come from their newest code (main, or the
      # branch with the same name as this PR), not pub.dev. On a tag it
      # does nothing. See the script.
      - run: ci/use-siblings.sh
      # Caches the Rust dependencies of the native packages.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          workspaces: |
            ../dox-http-native/native -> target
      # Builds the native libraries of the clones, for this machine only.
      - run: ci/use-siblings.sh build
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run
